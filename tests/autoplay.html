<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yatzy - Autoplay</title>
    <!--
      autoplay.html
      A bot plays the real game page (loaded in the iframe) by clicking it
      like a person would: Roll, keep dice, choose a box, End Turn.
    -->
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        font-family: system-ui, sans-serif;
        background: #121212;
        color: #eeeeee;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 1rem;
        border-bottom: 2px solid #a8862b;
      }

      button,
      select {
        font: inherit;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <label>
        Speed
        <select id="speed">
          <option value="700">Slow</option>
          <option value="300" selected>Normal</option>
          <option value="60">Fast</option>
        </select>
      </label>
      <button id="start">Play a game</button>
      <span id="status"></span>
    </div>

    <iframe
      id="game"
      src="../index.html"
      title="Yatzy game played by the bot"
    ></iframe>

    <script>
      const frame = document.getElementById("game");
      const startButton = document.getElementById("start");
      const speedSelect = document.getElementById("speed");
      const statusText = document.getElementById("status");

      /**
       * Pauses between actions so you can watch.
       * @returns {Promise<void>}
       */
      function wait() {
        return new Promise((resolve) =>
          setTimeout(resolve, Number(speedSelect.value)),
        );
      }

      /**
       * Finds one element inside the game page.
       * @param {string} selector - a CSS selector
       * @returns {Element|null}
       */
      function find(selector) {
        return frame.contentDocument.querySelector(selector);
      }

      /**
       * Finds all matching elements inside the game page.
       * @param {string} selector - a CSS selector
       * @returns {Element[]}
       */
      function findAll(selector) {
        return [...frame.contentDocument.querySelectorAll(selector)];
      }

      /**
       * Reads the dice by counting the pips on each one.
       * @returns {number[]}
       */
      function readDice() {
        return findAll(".die").map(
          (die) => die.querySelectorAll(".pip").length,
        );
      }

      /**
       * Keeps the dice showing the most common face and releases the rest.
       */
      async function keepBestDice() {
        const dice = readDice();
        const counts = [0, 0, 0, 0, 0, 0, 0];
        for (const value of dice) {
          counts[value]++;
        }

        // Most common face (the highest one on a tie)
        let bestFace = 6;
        for (let face = 6; face >= 1; face--) {
          if (counts[face] > counts[bestFace]) bestFace = face;
        }

        const dieButtons = findAll(".die");
        for (let i = 0; i < dice.length; i++) {
          const shouldKeep = dice[i] === bestFace;
          const isKept = dieButtons[i].classList.contains("held");
          if (shouldKeep !== isKept) {
            dieButtons[i].click();
            await wait();
          }
        }
      }

      /**
       * Clicks the open box with the highest preview score.
       */
      async function chooseBestBox() {
        let best = null;
        let bestScore = -1;
        for (const row of findAll("tr.open")) {
          const score = Number(row.querySelector(".score").textContent);
          if (score > bestScore) {
            best = row;
            bestScore = score;
          }
        }
        best.click();
        await wait();
      }

      /**
       * Plays one turn: roll up to 3 times, keeping dice in between,
       * then choose a box and press End Turn.
       */
      async function playTurn() {
        const rollButton = find("#roll-btn");
        for (let roll = 1; roll <= 3; roll++) {
          rollButton.click();
          await wait();

          // Stop rolling on a Yatzy
          const dice = readDice();
          if (dice.every((value) => value === dice[0])) {
            break;
          }
          if (roll < 3) {
            await keepBestDice();
          }
        }

        await chooseBestBox();
        find("#end-turn-btn").click();
        await wait();
      }

      /**
       * Plays a full game from the start until the game over pop-up opens.
       */
      async function playGame() {
        startButton.disabled = true;

        // Start fresh: close the pop-up if it's open and reset the game
        if (find("#game-over").open) {
          find("#new-game-btn").click();
        } else if (find("#end-game-btn").textContent === "New game") {
          find("#end-game-btn").click();
        }

        let round = 0;
        while (!find("#game-over").open) {
          round++;
          statusText.textContent = `Playing round ${round} of 15...`;
          await playTurn();
        }

        statusText.textContent = `Finished with ${find("#final-score").textContent} points.`;
        startButton.disabled = false;
      }

      startButton.addEventListener("click", playGame);
    </script>
  </body>
</html>
